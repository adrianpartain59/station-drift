# Builds the game and publishes it to GitHub Pages on every push to main.
# Live at https://adrianpartain59.github.io/station-drift/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# only one deploy at a time; a newer push replaces one still waiting
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # the only job allowed to publish, and it has no access to the code
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
